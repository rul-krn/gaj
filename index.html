<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07101d">
<title>AI Assistant Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#07101d;
--bg2:#0a1422;
--panel:#0d1726;
--panel2:#111d2e;
--border:#22334a;
--text:#e8f0fb;
--muted:#8da0b8;
--accent:#38bdf8;
--accent2:#2563eb;
--user:#075985;
--success:#22c55e;
--danger:#ef4444
}
html,body{width:100%;height:100%;overflow:hidden}
body{
font-family:Inter,"Segoe UI",Arial,sans-serif;
background:radial-gradient(circle at top,#142a44 0,#07101d 45%,#040a12 100%);
color:var(--text)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{
height:100vh;
display:grid;
grid-template-columns:260px minmax(0,1fr);
overflow:hidden
}
.sidebar{
background:rgba(6,13,23,.94);
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
padding:14px;
gap:14px
}
.brand{
display:flex;
align-items:center;
gap:10px;
padding:8px 4px 14px
}
.logo{
width:40px;
height:40px;
border-radius:12px;
display:grid;
place-items:center;
background:linear-gradient(135deg,#38bdf8,#6366f1);
box-shadow:0 8px 30px rgba(56,189,248,.2);
font-weight:900;
color:#00111d
}
.brand b{font-size:16px}
.brand span{
display:block;
font-size:11px;
color:var(--muted);
margin-top:2px
}
.new-chat{
width:100%;
padding:11px;
border-radius:11px;
border:1px solid #29445e;
background:#102239;
color:#e5f7ff;
font-weight:700
}
.new-chat:hover{
background:#14304a;
border-color:var(--accent)
}
.side-title{
font-size:10px;
letter-spacing:1.2px;
text-transform:uppercase;
color:#61758d;
margin:5px 4px
}
.chat-list{
flex:1;
overflow:auto;
display:flex;
flex-direction:column;
gap:5px
}
.chat-item{
width:100%;
border:1px solid transparent;
background:transparent;
color:#b9c9dc;
padding:10px;
border-radius:9px;
text-align:left;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}
.chat-item:hover,
.chat-item.active{
background:#101f32;
border-color:#1f3852;
color:#fff
}
.sidebar-bottom{
border-top:1px solid var(--border);
padding-top:12px
}
.status{
display:flex;
align-items:center;
gap:8px;
font-size:11px;
color:var(--muted)
}
.online-dot{
width:8px;
height:8px;
border-radius:50%;
background:var(--success);
box-shadow:0 0 12px rgba(34,197,94,.7)
}
.main{
min-width:0;
display:flex;
flex-direction:column
}
.header{
height:64px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
border-bottom:1px solid var(--border);
background:rgba(8,17,30,.75);
backdrop-filter:blur(18px)
}
.header-title{
font-weight:800
}
.header-sub{
font-size:11px;
color:var(--muted);
margin-top:2px
}
.header-actions{
display:flex;
align-items:center;
gap:7px
}
select,
.icon-btn{
border:1px solid var(--border);
background:#0e1b2c;
color:#dce8f7;
border-radius:9px
}
select{padding:8px 10px}
.icon-btn{
width:38px;
height:38px
}
.icon-btn:hover{
border-color:#3a5d7d;
background:#12243a
}
.chat{
flex:1;
overflow-y:auto;
padding:25px 16px 155px
}
.messages{
max-width:900px;
margin:auto;
display:flex;
flex-direction:column;
gap:18px
}
.welcome{
text-align:center;
padding:8vh 10px 30px
}
.hero-icon{
font-size:48px;
margin-bottom:14px;
background:linear-gradient(135deg,#38bdf8,#8b5cf6);
-webkit-background-clip:text;
color:transparent
}
.welcome h1{
font-size:32px;
letter-spacing:-1px
}
.welcome p{
max-width:650px;
margin:10px auto 0;
color:var(--muted);
line-height:1.6
}
.suggestions{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
max-width:720px;
margin:28px auto
}
.suggestion{
padding:13px;
text-align:left;
background:#0d1929;
border:1px solid var(--border);
border-radius:12px;
color:#cbd9e9;
transition:.2s
}
.suggestion:hover{
background:#10263b;
border-color:#37627f;
transform:translateY(-1px)
}
.message{
display:flex;
align-items:flex-start;
gap:11px
}
.avatar{
width:34px;
height:34px;
flex:0 0 34px;
border-radius:10px;
display:grid;
place-items:center;
font-weight:800;
font-size:13px
}
.message.user .avatar{
background:#086d9e
}
.message.assistant .avatar{
background:linear-gradient(135deg,#2563eb,#7c3aed)
}
.bubble{
min-width:0;
max-width:calc(100% - 46px);
color:#dce7f5;
line-height:1.65
}
.message.user .bubble{
background:linear-gradient(135deg,#075985,#0369a1);
color:white;
padding:11px 14px;
border-radius:14px 14px 3px 14px;
white-space:normal;
word-break:break-word
}
.message.assistant .bubble{
padding:2px 0;
word-break:break-word
}
.meta{
font-size:10px;
color:#667b94;
margin-top:5px
}
.bubble p{
margin:7px 0
}
.bubble h1,
.bubble h2,
.bubble h3{
margin:17px 0 8px;
color:white
}
.bubble ul,
.bubble ol{
margin:8px 0 8px 22px
}
.bubble li{
margin:4px 0
}
.bubble strong{color:#fff}
.bubble em{color:#c6d8eb}
.bubble a{
color:#67d3ff;
text-decoration:none
}
.bubble a:hover{text-decoration:underline}
.inline-code{
background:#142235;
border:1px solid #263d56;
padding:2px 5px;
border-radius:5px;
font-family:Consolas,monospace;
font-size:.9em
}
.code-wrap{
margin:12px 0;
background:#060b12;
border:1px solid #263b54;
border-radius:12px;
overflow:hidden
}
.code-head{
height:35px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
background:#0d1725;
border-bottom:1px solid #1e3148;
color:#8296ad;
font-size:11px
}
.copy-btn{
border:1px solid #2b425b;
background:#172538;
color:#bdd0e4;
border-radius:6px;
padding:4px 8px;
font-size:11px
}
.copy-btn:hover{
background:#21344b;
color:#fff
}
pre{
margin:0;
padding:14px;
overflow:auto;
font-family:Consolas,Monaco,"Courier New",monospace;
font-size:13px;
line-height:1.55;
color:#d9f2ff;
white-space:pre
}
.typing{
display:inline-flex;
align-items:center;
gap:4px;
padding:10px 12px;
border-radius:11px;
background:#0e1b2c;
border:1px solid #22354d
}
.typing i{
width:6px;
height:6px;
border-radius:50%;
background:#38bdf8;
animation:typing 1s infinite
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes typing{
0%,100%{transform:translateY(0);opacity:.35}
50%{transform:translateY(-4px);opacity:1}
}
.composer-area{
position:fixed;
left:260px;
right:0;
bottom:0;
padding:10px 16px 16px;
background:linear-gradient(transparent,rgba(4,10,18,.98) 30%)
}
.composer{
max-width:900px;
margin:auto;
border:1px solid #2a4057;
background:#0d1828;
border-radius:17px;
overflow:hidden;
box-shadow:0 -10px 45px rgba(0,0,0,.3)
}
.tools{
display:flex;
align-items:center;
gap:6px;
padding:8px 10px;
border-bottom:1px solid #203148
}
.tool{
border:1px solid transparent;
background:transparent;
color:#8fa4bb;
border-radius:7px;
padding:5px 8px;
font-size:12px
}
.tool:hover,
.tool.active{
background:#13243a;
border-color:#294761;
color:#e1f7ff
}
.file-label input{display:none}
textarea{
width:100%;
min-height:55px;
max-height:180px;
resize:none;
border:0;
outline:0;
background:transparent;
color:#f4f8ff;
padding:13px 14px;
font-size:15px;
line-height:1.5
}
textarea::placeholder{color:#60758d}
.send-row{
display:flex;
justify-content:flex-end;
padding:7px
}
.send{
width:43px;
height:38px;
border:0;
border-radius:10px;
background:linear-gradient(135deg,#0ea5e9,#2563eb);
color:white;
font-size:18px;
box-shadow:0 4px 15px rgba(37,99,235,.25)
}
.send:hover{
filter:brightness(1.1)
}
.send:disabled{
opacity:.4;
cursor:not-allowed
}
.stop{
display:none;
border:1px solid #63303a;
background:#3a1720;
color:#ffabb7;
border-radius:8px;
padding:6px 10px;
font-size:11px
}
.file-chip{
display:none;
align-items:center;
justify-content:space-between;
gap:10px;
margin:8px 10px 0;
padding:7px 9px;
border:1px solid #294762;
background:#102237;
border-radius:8px;
font-size:12px;
color:#a9c9df
}
.remove-file{
background:transparent;
border:0;
color:#94a3b8;
font-size:17px
}
.empty{
text-align:center;
color:#60758d;
font-size:12px;
padding:20px
}
::-webkit-scrollbar{
width:7px;
height:7px
}
::-webkit-scrollbar-track{
background:transparent
}
::-webkit-scrollbar-thumb{
background:#20344b;
border-radius:20px
}
::-webkit-scrollbar-thumb:hover{
background:#2d4b68
}
@media(max-width:760px){
html,body{overflow:hidden}
.app{grid-template-columns:1fr}
.sidebar{display:none}
.header{height:56px;padding:0 11px}
.header-sub{display:none}
.chat{padding:18px 11px 145px}
.welcome{padding-top:7vh}
.welcome h1{font-size:26px}
.suggestions{grid-template-columns:1fr;margin-top:22px}
.composer-area{
left:0;
padding:7px
}
.header-actions select{
max-width:120px
}
.bubble{
max-width:calc(100% - 44px)
}
}
</style>
</head>

<body>

<div class="app">

<script>

/* ============================================================
   AI ASSISTANT PRO
   Frontend Single HTML
   Backend default: http://localhost:3000
   ============================================================ */

/*
   PENTING:

   Jangan menaruh OpenAI API key di file HTML.

   HTML ini mengirim permintaan ke:

   http://localhost:3000/api/chat
   atau
   http://localhost:3000/api/chat/stream

   Server Express yang memegang API key.
*/

const API_BASE = "";

const chatBox = document.getElementById("chatBox");
const messagesEl = document.getElementById("messages");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const newChatBtn = document.getElementById("newChat");
const clearChatBtn = document.getElementById("clearChat");
const modeEl = document.getElementById("mode");
const webBtn = document.getElementById("webBtn");
const stopBtn = document.getElementById("stopBtn");
const fileInput = document.getElementById("fileInput");
const fileChip = document.getElementById("fileChip");
const chatList = document.getElementById("chatList");
const serverStatus = document.getElementById("serverStatus");

let webSearch = false;
let attachedFile = null;
let controller = null;

let chats = [];

try {
  chats = JSON.parse(
    localStorage.getItem("ai_assistant_pro_chats") || "[]"
  );
} catch {
  chats = [];
}

let activeChatId =
  localStorage.getItem("ai_assistant_pro_active") || null;


/* ============================================================
   UTILITIES
   ============================================================ */

function createId(){

  return (
    Date.now().toString(36) +
    Math.random().toString(36).substring(2,9)
  );

}


function saveState(){

  localStorage.setItem(
    "ai_assistant_pro_chats",
    JSON.stringify(chats)
  );

  if(activeChatId){

    localStorage.setItem(
      "ai_assistant_pro_active",
      activeChatId
    );

  }

  renderChatList();

}


function getActiveChat(){

  return chats.find(
    chat => chat.id === activeChatId
  );

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ============================================================
   MARKDOWN
   ============================================================ */

function renderInlineMarkdown(text){

  return text

    .replace(
      /`([^`\n]+)`/g,
      '<span class="inline-code">$1</span>'
    )

    .replace(
      /\*\*(.+?)\*\*/g,
      "<strong>$1</strong>"
    )

    .replace(
      /\*(.+?)\*/g,
      "<em>$1</em>"
    )

    .replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>'
    );

}


function renderMarkdown(text){

  if(!text){
    return "";
  }

  let source = escapeHTML(text);

  const codeBlocks = [];

  source = source.replace(
    /```([a-zA-Z0-9_+#.-]*)\n?([\s\S]*?)```/g,
    function(_,language,code){

      const index = codeBlocks.length;

      codeBlocks.push({
        language: language || "code",
        code: code
          .replace(/^\n/,"")
          .replace(/\n$/,"")
      });

      return `___CODE_BLOCK_${index}___`;

    }
  );

  const lines = source.split("\n");

  const output = [];

  let listOpen = false;

  for(const line of lines){

    if(/^#{1,3}\s/.test(line)){

      if(listOpen){

        output.push("</ul>");
        listOpen = false;

      }

      const match = line.match(
        /^(#{1,3})\s(.+)$/
      );

      const level = match[1].length;

      output.push(
        `<h${level}>${renderInlineMarkdown(match[2])}</h${level}>`
      );

      continue;

    }


    if(/^[-*]\s/.test(line)){

      if(!listOpen){

        output.push("<ul>");
        listOpen = true;

      }

      output.push(
        `<li>${renderInlineMarkdown(
          line.substring(2)
        )}</li>`
      );

      continue;

    }


    if(/^\d+\.\s/.test(line)){

      if(listOpen){

        output.push("</ul>");
        listOpen = false;

      }

      output.push(
        `<p>${renderInlineMarkdown(line)}</p>`
      );

      continue;

    }


    if(listOpen){

      output.push("</ul>");
      listOpen = false;

    }


    if(line.trim()===""){

      output.push("<br>");

    }else{

      output.push(
        `<p>${renderInlineMarkdown(line)}</p>`
      );

    }

  }

  if(listOpen){

    output.push("</ul>");

  }


  let result = output.join("");

  codeBlocks.forEach(
    function(block,index){

      const safeCode = block.code;

      const encodedCode =
        encodeURIComponent(block.code);

      const html = `
        <div class="code-wrap">

          <div class="code-head">

            <span>${escapeHTML(
              block.language
            )}</span>

            <button
              class="copy-btn"
              data-code="${encodedCode}">
              Salin
            </button>

          </div>

          <pre><code>${safeCode}</code></pre>

        </div>
      `;

      result = result.replace(
        `___CODE_BLOCK_${index}___`,
        html
      );

    }
  );

  return result;

}


/* ============================================================
   CHAT LIST
   ============================================================ */

function renderChatList(){

  if(!chats.length){

    chatList.innerHTML =
      '<div class="empty">Belum ada percakapan</div>';

    return;

  }

  chatList.innerHTML =
    chats
      .slice()
      .reverse()
      .map(function(chat){

        return `
          <button
            class="chat-item ${
              chat.id === activeChatId
                ? "active"
                : ""
            }"
            data-chat-id="${chat.id}">
            ${escapeHTML(
              chat.title || "Chat baru"
            )}
          </button>
        `;

      })
      .join("");

}


/* ============================================================
   MESSAGE UI
   ============================================================ */

function showWelcome(){

  messagesEl.innerHTML = `

    <div class="welcome">

      <div class="hero-icon">✦</div>

      <h1>Apa yang bisa saya bantu?</h1>

      <p>
        Saya adalah AI Assistant Pro.
        Tanya apa saja, buat kode, debug,
        belajar, menulis, atau cari informasi terbaru.
      </p>

      <div class="suggestions">

        <button class="suggestion">
          Buatkan landing page HTML modern
        </button>

        <button class="suggestion">
          Jelaskan JavaScript async/await dengan contoh
        </button>

        <button class="suggestion">
          Bantu debug kode saya
        </button>

        <button class="suggestion">
          Cari informasi terbaru tentang teknologi AI
        </button>

      </div>

    </div>

  `;

}


function addMessage(role,text,scroll=true){

  const row = document.createElement("div");

  row.className =
    `message ${role}`;

  const avatar =
    role === "user"
      ? "U"
      : "✦";

  row.innerHTML = `

    <div class="avatar">
      ${avatar}
    </div>

    <div class="bubble">

      ${
        role === "assistant"
          ? renderMarkdown(text)
          : escapeHTML(text).replace(
              /\n/g,
              "<br>"
            )
      }

      <div class="meta">
        ${
          role === "user"
            ? "Anda"
            : "AI Assistant Pro"
        }
      </div>

    </div>

  `;

  messagesEl.appendChild(row);

  if(scroll){

    scrollToBottom();

  }

  return row.querySelector(".bubble");

}


function renderMessages(){

  const chat = getActiveChat();

  messagesEl.innerHTML = "";

  if(!chat || !chat.messages.length){

    showWelcome();

    return;

  }

  chat.messages.forEach(function(message){

    addMessage(
      message.role,
      message.content,
      false
    );

  });

  scrollToBottom();

}


function scrollToBottom(){

  chatBox.scrollTop =
    chatBox.scrollHeight;

}


/* ============================================================
   CHAT MANAGEMENT
   ============================================================ */

function createChat(firstMessage="Chat baru"){

  activeChatId = createId();

  chats.push({

    id: activeChatId,

    title:
      firstMessage
        .substring(0,42)
        .trim() || "Chat baru",

    messages: [],

    createdAt: Date.now()

  });

  saveState();

  return getActiveChat();

}


function ensureChat(message){

  let chat = getActiveChat();

  if(!chat){

    chat = createChat(message);

  }

  return chat;

}


function newChat(){

  activeChatId = null;

  attachedFile = null;

  fileInput.value = "";

  fileChip.style.display = "none";

  input.value = "";

  saveState();

  renderMessages();

  input.focus();

}


function deleteCurrentChat(){

  if(!activeChatId){

    return;

  }

  const chat = getActiveChat();

  if(!chat){

    return;

  }

  const okay =
    confirm(
      "Hapus percakapan ini?"
    );

  if(!okay){

    return;

  }

  chats =
    chats.filter(
      c => c.id !== activeChatId
    );

  activeChatId = null;

  saveState();

  renderMessages();

}


/* ============================================================
   SERVER STATUS
   ============================================================ */

async function checkServer(){

  try{

    const response =
      await fetch(
        `${API_BASE}/api/health`
      );

    const data =
      await response.json();

    if(data.configured){

      serverStatus.textContent =
        `Online • ${data.model || "AI"}`;

    }else{

      serverStatus.textContent =
        "Server online • API key belum diatur";

    }

  }catch(error){

    serverStatus.textContent =
      "Backend offline";

  }

}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

async function sendMessage(){

  const message =
    input.value.trim();

  if(!message){

    return;

  }

  if(controller){

    return;

  }

  const chat =
    ensureChat(message);

  if(!chat.messages.length){

    chat.title =
      message.substring(0,42);

  }

  chat.messages.push({

    role:"user",

    content:message

  });

  addMessage(
    "user",
    message
  );

  input.value = "";

  input.style.height = "55px";

  const assistantBubble =
    addMessage(
      "assistant",
      `<span class="typing">
        <i></i><i></i><i></i>
      </span>`
    );

  chat.messages.push({

    role:"assistant",

    content:""

  });

  const assistantIndex =
    chat.messages.length - 1;

  sendBtn.disabled = true;

  stopBtn.style.display =
    "inline-block";

  controller =
    new AbortController();

  try{

    const response =
      await fetch(
        `${API_BASE}/api/chat/stream`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          signal:
            controller.signal,

          body:JSON.stringify({

            message,

            history:
              chat.messages
                .slice(0,-2),

            mode:
              modeEl.value,

            webSearch,

            attachment:
              attachedFile

          })

        }
      );


    if(!response.ok){

      let errorData = {};

      try{

        errorData =
          await response.json();

      }catch{}

      throw new Error(
        errorData.error ||
        `HTTP ${response.status}`
      );

    }


    if(!response.body){

      throw new Error(
        "Browser tidak mendukung streaming."
      );

    }


    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder();

    let buffer = "";

    assistantBubble.innerHTML = "";


    while(true){

      const result =
        await reader.read();

      if(result.done){

        break;

      }


      buffer +=
        decoder.decode(
          result.value,
          {
            stream:true
          }
        );


      const events =
        buffer.split("\n\n");

      buffer =
        events.pop();


      for(const event of events){

        const line =
          event
            .split("\n")
            .find(
              x =>
                x.startsWith("data: ")
            );

        if(!line){

          continue;

        }


        const payload =
          line.substring(6);


        if(payload === "[DONE]"){

          continue;

        }


        let data;

        try{

          data =
            JSON.parse(payload);

        }catch{

          continue;

        }


        if(data.type === "delta"){

          chat.messages[
            assistantIndex
          ].content +=
            data.text;

          assistantBubble.innerHTML =
            renderMarkdown(
              chat.messages[
                assistantIndex
              ].content
            );

          scrollToBottom();

        }


        if(data.type === "error"){

          throw new Error(
            data.error ||
            "AI streaming error"
          );

        }

      }

    }


    if(
      !chat.messages[
        assistantIndex
      ].content
    ){

      chat.messages[
        assistantIndex
      ].content =
        "AI tidak mengembalikan teks.";

    }


    saveState();

  }catch(error){

    if(
      error.name ===
      "AbortError"
    ){

      if(
        !chat.messages[
          assistantIndex
        ].content
      ){

        chat.messages[
          assistantIndex
        ].content =
          "Generasi dihentikan.";

      }

      assistantBubble.innerHTML =
        "<p>Generasi dihentikan.</p>";

    }else{

      chat.messages[
        assistantIndex
      ].content =
        `Gagal terhubung ke AI: ${error.message}`;

      assistantBubble.innerHTML = `

        <p>
          <strong style="color:#ff9fab">
            Gagal:
          </strong>
          ${escapeHTML(error.message)}
        </p>

        <p style="color:#8da0b8;font-size:12px">
          Pastikan server.js berjalan
          di localhost:3000.
        </p>

      `;

    }

    saveState();

  }finally{

    controller = null;

    sendBtn.disabled = false;

    stopBtn.style.display =
      "none";

    attachedFile = null;

    fileInput.value = "";

    fileChip.style.display =
      "none";

  }

}


/* ============================================================
   FILE UPLOAD
   ============================================================ */

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      fileInput.files[0];

    if(!file){

      return;

    }

    try{

      const text =
        await file.text();

      attachedFile = {

        name:file.name,

        text:
          text.substring(
            0,
            50000
          )

      };


      fileChip.style.display =
        "flex";


      fileChip.innerHTML = `

        <span>
          📎
          ${escapeHTML(file.name)}
          •
          ${Math.round(file.size/1024)}
          KB
        </span>

        <button
          class="remove-file"
          id="removeFile">
          ×
        </button>

      `;

    }catch(error){

      alert(
        "File tidak dapat dibaca."
      );

    }

  }
);


fileChip.addEventListener(
  "click",
  function(event){

    if(
      event.target.id ===
      "removeFile"
    ){

      attachedFile = null;

      fileInput.value = "";

      fileChip.style.display =
        "none";

    }

  }
);


/* ============================================================
   WEB SEARCH
   ============================================================ */

webBtn.addEventListener(
  "click",
  function(){

    webSearch =
      !webSearch;

    webBtn.textContent =
      `🌐 Web Search: ${
        webSearch
          ? "ON"
          : "OFF"
      }`;

    webBtn.classList.toggle(
      "active",
      webSearch
    );

  }
);


/* ============================================================
   TEXTAREA
   ============================================================ */

input.addEventListener(
  "input",
  function(){

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        180
      ) + "px";

  }
);


input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ============================================================
   BUTTONS
   ============================================================ */

sendBtn.addEventListener(
  "click",
  sendMessage
);


newChatBtn.addEventListener(
  "click",
  newChat
);


clearChatBtn.addEventListener(
  "click",
  deleteCurrentChat
);


stopBtn.addEventListener(
  "click",
  function(){

    if(controller){

      controller.abort();

    }

  }
);


/* ============================================================
   SUGGESTIONS + COPY
   ============================================================ */

messagesEl.addEventListener(
  "click",
  function(event){

    const suggestion =
      event.target.closest(
        ".suggestion"
      );

    if(suggestion){

      input.value =
        suggestion.textContent.trim();

      input.focus();

      input.dispatchEvent(
        new Event("input")
      );

      return;

    }


    const copyButton =
      event.target.closest(
        ".copy-btn"
      );

    if(copyButton){

      const code =
        decodeURIComponent(
          copyButton.dataset.code
        );

      navigator.clipboard
        .writeText(code)
        .then(function(){

          const old =
            copyButton.textContent;

          copyButton.textContent =
            "Tersalin ✓";

          setTimeout(
            function(){

              copyButton.textContent =
                old;

            },
            1300
          );

        });

    }

  }
);


/* ============================================================
   CHAT SELECT
   ============================================================ */

chatList.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(
        "[data-chat-id]"
      );

    if(!button){

      return;

    }

    activeChatId =
      button.dataset.chatId;

    localStorage.setItem(
      "ai_assistant_pro_active",
      activeChatId
    );

    renderChatList();

    renderMessages();

    input.focus();

  }
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

renderChatList();

renderMessages();

checkServer();

input.focus();

</script>

</body>
</html>
